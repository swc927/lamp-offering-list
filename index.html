<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Lamp Offering List Generator by SWC</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous" defer></script>
  <script type="module" src="script.js"></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">LAMP OFFERING LABELS</p>
      <h1>Lamp Offering List Generator</h1>
      <p>Paste one lamp number and name per line. Review all warnings before downloading the PDF.</p>
    </header>
    <section class="controls" aria-labelledby="inputHeading">
      <h2 id="inputHeading">Lamp list</h2>
      <label class="file-label" for="csvInput">Import a CSV file</label>
      <input type="file" id="csvInput" accept=".csv,text/csv">
      <label for="input">Lamp number and display name</label>
      <textarea id="input" placeholder="M0001&#9;Display Name&#10;M0002&#9;故 Deceased Name" spellcheck="false"></textarea>
      <div class="actions">
        <button id="generate" type="button">Validate and generate</button>
        <button id="downloadPDF" class="secondary" type="button" disabled>Download verified PDF</button>
      </div>
    </section>
    <section id="report" class="report" aria-live="polite">
      <h2>Validation report</h2>
      <p id="status">No list has been generated.</p>
      <div id="counts" class="counts"></div>
      <ul id="issues" class="issues"></ul>
    </section>
    <div id="pageCount" class="page-count-display"></div>
    <div id="output" aria-label="Generated lamp label pages"></div>
  </main>
</body>
</html>
